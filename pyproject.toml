[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-ai-it-helpdesk"
version = "0.1.0"
description = "Local Streamlit AI IT Help Desk demo with RAG, tools, tickets, and evaluation."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.49.0",
  "pandas>=2.2.3",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "scikit-learn>=1.6.1",
  "streamlit>=1.41.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
